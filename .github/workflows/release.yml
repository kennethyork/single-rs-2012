name: Release

# Run from the Actions tab: Release > Run workflow.
#
# Builds the client from main, then makes the new release's archives from the
# previous release's archives (which carry the game cache and Java runtime that
# are not stored in this repository) using tools/repack-release.py. Publishes
# them with docs/releases/<version>.md as the release notes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New release tag"
        required: true
        default: "v0.17.0"
      base:
        description: "Previous release to take the cache and runtime from"
        required: true
        default: "v0.16.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      BASE: ${{ inputs.base }}
    steps:
      - uses: actions/checkout@v6

      - name: Check inputs
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists."
            exit 1
          fi
          if [ ! -f "docs/releases/$VERSION.md" ]; then
            echo "::error::Release notes docs/releases/$VERSION.md are missing."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Build client
        run: gradle -p darkan-client shadowJar

      - name: Download ${{ inputs.base }} archives
        run: |
          mkdir -p base out
          gh release download "$BASE" --dir base \
            --pattern '*-linux-x64.tar.gz' --pattern '*-windows-x64.zip' --pattern '*-macos-x64.zip'
          ls -l base

      - name: Build ${{ inputs.version }} archives
        run: |
          jar=darkan-client/build/libs/darkan-client-shaded-1.0.1-all.jar
          for platform in linux-x64.tar.gz windows-x64.zip macos-x64.zip; do
            python3 tools/repack-release.py \
              "base/Single-RS-2012-$BASE-$platform" \
              "out/Single-RS-2012-$VERSION-$platform" \
              "$jar"
          done
          rm -rf base
          (cd out && sha256sum Single-RS-2012-* > "Single-RS-2012-$VERSION-SHA256SUMS.txt")
          ls -l out
          cat out/*SHA256SUMS.txt

      - name: Publish ${{ inputs.version }}
        run: |
          gh release create "$VERSION" out/* \
            --target "$GITHUB_SHA" \
            --title "Single RS 2012 $VERSION" \
            --notes-file "docs/releases/$VERSION.md"
